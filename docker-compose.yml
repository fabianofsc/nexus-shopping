# Topologia reduzida para a demo de cache-aside (Bloco 1 de "Escalando a Leitura
# com Cache"): mantemos o Load Balancer para não corrigir a arquitetura ensinada
# até aqui, mas com uma unica instancia da aplicacao atras dele -- o suficiente
# para medir o efeito puro do cache-aside sem diluir o trafego entre replicas.
# Mesmo cenario de v3.2.1-single-instance, unica diferenca: o codigo aqui ja
# tem o cache-aside implementado (CachingProductRepositoryAdapter).
#
# Por padrao, "docker compose up -d" (sem --build) baixa a imagem publicada no
# Docker Hub -- o aluno nao precisa buildar nada localmente. Para reconstruir a
# partir do codigo (ex.: durante desenvolvimento), use:
#   APP_IMAGE=nexus-shopping:local docker compose up --build -d
x-app: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: ${APP_IMAGE:-fabianofsc/nexus-shopping:v3.3.1-single-instance}
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/nexus_shopping
    DB_USERNAME: nexus
    DB_PASSWORD: nexus
    PRODUCT_SEED_COUNT: ${PRODUCT_SEED_COUNT:-1000}
  expose:
    - "8080"
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - backend
  restart: unless-stopped

services:
  app1:
    <<: *app-base
    hostname: app1

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
    networks:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nexus-shopping-postgres
    environment:
      POSTGRES_DB: nexus_shopping
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_shopping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
