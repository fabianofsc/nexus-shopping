# 1 worker para tornar o round-robin deterministico e a alternancia nitida
# neste demo didatico. Em producao, prefira "auto" (1 worker por CPU); nesse
# caso cada worker mantem seu proprio contador e a distribuicao so tende a
# ~uniforme no agregado de muitas requisicoes, nao em rajadas curtas.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------
    # Upstream com as 3 instancias da aplicacao.
    #
    # Para trocar o algoritmo de balanceamento basta comentar/descomentar
    # linhas abaixo -- nao e preciso reescrever o bloco. Depois recarregue
    # o nginx sem downtime:
    #
    #   docker compose exec nginx nginx -s reload
    # ------------------------------------------------------------------
    upstream backend {
        # === Round-robin (ATIVO / default) ===
        # Sem diretiva de algoritmo: distribui as requisicoes em rodizio
        # sequencial e uniforme. Comente estas 3 linhas ao ativar o
        # weighted round-robin abaixo.
        server app1:8080;
        server app2:8080;
        server app3:8080;

        # --- Weighted round-robin: use quando as instancias tem capacidade diferente (mais peso -> mais requisicoes) ---
        # server app1:8080 weight=3;
        # server app2:8080 weight=1;
        # server app3:8080 weight=1;

        # --- least_conn: use quando a duracao das requisicoes varia muito; envia para a instancia com menos conexoes ativas ---
        # least_conn;

        # --- ip_hash: use para "sticky sessions" sem estado compartilhado; fixa cada IP de cliente na mesma instancia ---
        # ip_hash;

        # --- hash $request_uri consistent: use para afinidade de cache; a mesma URI cai sempre na mesma instancia ---
        # hash $request_uri consistent;

        # --- random two least_conn: use em upstreams grandes; sorteia 2 instancias e escolhe a de menos conexoes entre elas ---
        # random two least_conn;
    }

    server {
        listen 80;

        # Header customizado com o endereco da instancia que atendeu a
        # requisicao -- permite identificar visualmente o balanceamento.
        add_header X-Upstream $upstream_addr always;

        location / {
            proxy_pass http://backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
