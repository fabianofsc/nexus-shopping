# 1 worker para tornar o round-robin deterministico e a alternancia nitida
# neste demo didatico. Em producao, prefira "auto" (1 worker por CPU); nesse
# caso cada worker mantem seu proprio contador e a distribuicao so tende a
# ~uniforme no agregado de muitas requisicoes, nao em rajadas curtas.
worker_processes 1;

events {
    worker_connections 8192;
}

http {
    # ------------------------------------------------------------------
    # Upstream com uma unica instancia da aplicacao.
    #
    # Topologia reduzida de proposito para a demo de cache-aside: o Load
    # Balancer continua no caminho (mesma arquitetura ja ensinada), mas so
    # existe app1 atras dele -- sem 2a/3a instancia diluindo o hit ratio do
    # cache local durante a medicao. O incoherence bug entre replicas fica
    # para o bloco seguinte, quando o numero de instancias volta a subir.
    # ------------------------------------------------------------------
    upstream backend {
        server app1:8080;
    }

    server {
        listen 80;

        # Header customizado com o endereco da instancia que atendeu a
        # requisicao -- permite identificar visualmente o balanceamento.
        add_header X-Upstream $upstream_addr always;

        location / {
            proxy_pass http://backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
