spring:
  cache:
    type: simple
  jpa:
    open-in-view: false

management:
  health:
    redis:
      enabled: false

nexus:
  payment-service:
    base-url: http://localhost:8081
    polling-interval: 600000
  notification-service:
    base-url: http://localhost:8082
    username: notification
    password: notification
    connect-timeout: 5s
    read-timeout: 5s
  cache:
    redis:
      enabled: false
