# Override minimo: publica a porta 8080 direto no host para o app1.
#
# So necessario para o Bloco 2 da aula "Escalando a Leitura com Replicas"
# (uma instancia so, sem nginx). NAO pode ir para o docker-compose.yml base:
# as aulas de Load Balancer/Auto Scaling sobem app1+app2+app3+nginx juntos, e
# o nginx ja publica 8080 -- se app1 tambem publicasse, essas aulas quebrariam
# por porta duplicada.
#
# DB_URL/DB_USERNAME/DB_PASSWORD ja sao parametrizaveis direto no
# docker-compose.yml (${DB_URL:-...} etc.) -- nao precisam de override aqui.
#
# ATENCAO -- rodar SEMPRE com as mesmas variaveis de ambiente exportadas na
# mesma sessao de terminal onde o app foi subido. Rodar "docker compose"
# (com ou sem este -f) de outra sessao/shell sem as mesmas DB_URL/
# DB_USERNAME/DB_PASSWORD faz o Compose recriar o app1 com o default local
# (jdbc:postgresql://postgres:5432/...), derrubando a conexao com o RDS.
#
# Uso:
#   DB_URL=jdbc:postgresql://<endpoint-rds>:5432/nexus_shopping \
#   DB_USERNAME=nexus \
#   DB_PASSWORD='<senha>' \
#   docker compose -f docker-compose.yml -f docker-compose.rds.yml up -d app1
services:
  app1:
    ports:
      - "8080:8080"
